name: check-contract

on:
  push:
    paths: ['tests/contract/**']
  pull_request:
    paths: ['tests/contract/**']

jobs:
  fixture-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check fixture YAML syntax
        run: |
          pip install pyyaml
          python tests/contract/check_fixtures.py
