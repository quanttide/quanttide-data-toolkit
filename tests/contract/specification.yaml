metadata:
  name: xmucpp
  version: "1.0.0"
  description: 电商价格数据库
spec:
  contract:
    input:
      schema: "{ product_id: string, platform: string, keyword: string, price: number, sales: number }"
      format: CSV
    output:
      schema: "{ product_id: string, platform: string, date: string, price: number, sales: number, missing: boolean }"
      format: CSV
      rules:
        - 数据完整性校验
  blueprint:
    name: xmucpp
    description: 电商价格数据库（契约测试 fixture）
    steps:
      - name: categorize
        from: raw_records
        to: categorized
        desc: 商品类别分配器
      - name: collect_list
        from: categorized
        to: product_list
        desc: 商品列表采集器
        depends: [categorize]
      - name: collect_detail
        from: product_list
        to: product_records
        desc: 商品详情采集器
        depends: [collect_list]
